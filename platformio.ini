[env:Proteus32]
platform = ch32v
board = genericCH32V003F4U6
framework = noneos-sdk
monitor_speed = 460800
board_build.use_lto = yes
board_build.ldscript = Link.ld
board_build.f_cpu = 24000000L
board_upload.maximum_size = 16128
lib_extra_dirs = libs
extra_scripts = post:tools/fw_size.py
build_flags = 
    -Iinclude
    -Wl,--defsym=FLASH_SIZE=16128
    -Wl,--defsym=RAM_SIZE=2048
    -Wno-packed-bitfield-compat
    -U__PIO_CPP_SUPPORT__
    -DWL_OB_ENABLE
    -DWL_FORMAT_VERSION=4
    -DWL_RECORD_SIZE=16
    -DWL_CRC_BITS=16

; RGB-вариант индикатора (PC7=red, PC4=green, PC6=blue), pio run -e Proteus32-RGB.
; WL_FORMAT_VERSION общий (4): в этом варианте драйвера старого формата EE.aux
; не существует, а дефолтная прошивка байт-идентична прежней.
[env:Proteus32-RGB]
extends = env:Proteus32
build_flags = 
    ${env:Proteus32.build_flags}
    -DUSE_IND_RGB=1
