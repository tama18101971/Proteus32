; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericCH32V003F4U6]
platform = ch32v
board = genericCH32V003F4U6
framework = noneos-sdk
monitor_speed = 115200
board_upload.maximum_size = 16128

; Переопределяем параметры памяти для линкера
; По умолчанию у CH32V003 стоит 16K (16384 байт). 
; Мы уменьшаем этот объем на 256 байт: 16384 - 256 = 16000 (0x3E80)
build_flags = 
    -Wl,--defsym=FLASH_SIZE=16128
    -Wl,--defsym=RAM_SIZE=2048
    -Wno-packed-bitfield-compat
