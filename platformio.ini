; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericCH32V003F4U6]
platform = ch32v
board = genericCH32V003F4U6
framework = noneos-sdk
monitor_speed = 115200
;board_build.ldscript = CH32V003.ld

; Переопределяем параметры памяти для линкера
; По умолчанию у CH32V003 стоит 16K (16384 байт). 
; Мы уменьшаем этот объем на 128 байт: 16384 - 128 = 16256 (0x3F80)
build_flags = 
    ;-Wl,--defsym=FLASH_SIZE=16256
    ;-Wl,--defsym=RAM_SIZE=2048
    -Wno-packed-bitfield-compat
