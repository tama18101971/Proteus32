[env:genericCH32V003F4U6]
platform = ch32v
board = genericCH32V003F4U6
framework = noneos-sdk
monitor_speed = 115200
board_upload.maximum_size = 16128
build_flags = 
    -Iinclude
    -Wl,--defsym=FLASH_SIZE=16128
    -Wl,--defsym=RAM_SIZE=2048
    -Wno-packed-bitfield-compat
lib_deps =
    https://github.com/tama18101971/I2C-CH32V003.git