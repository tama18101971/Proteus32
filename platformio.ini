[platformio]
default_envs = Proteus32, Proteus32-RGB, Proteus32-MCP4725, Proteus32-RGB-MCP4725

[env:Proteus32]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
board = genericCH32V003F4U6
framework = noneos-sdk
monitor_speed = 460800
board_build.use_lto = yes
board_build.ldscript = Link.ld
board_build.f_cpu = 24000000L
board_upload.maximum_size = 16128
; WL_FLASH подключён из репозитория (пин на тег), локальной вендоренной копии
; в libs/ больше нет. Формат записи на флэш не менялся начиная с 2.0.0:
; WL_FORMAT_VERSION=4 ниже соответствует текущему payloads.
lib_deps = https://github.com/tama18101971/WL_FLASH.git#v2.4.0
extra_scripts = post:tools/fw_size.py
build_flags = 
    -I${PROJECT_PACKAGES_DIR}/toolchain-riscv/riscv-wch-elf/include
    -Iinclude
    -Wl,--defsym=FLASH_SIZE=16128
    -Wl,--defsym=RAM_SIZE=2048
    -Wno-packed-bitfield-compat
    -U__PIO_CPP_SUPPORT__
    -DWL_OB_ENABLE
    -DWL_FORMAT_VERSION=4
    -DWL_RECORD_SIZE=16
    -DWL_CRC_BITS=16
; -Oz идёт в build_src_flags, а не в build_flags: платформа дописывает свой -Os
; в CCFLAGS (_bare.py:64) уже после обработки build_flags/build_unflags
; (platformio/builder/main.py:157 vs :173), и последний -O* выигрывает.
; build_src_flags применяется к src/*.c при создании клона окружения
; (piolib.py:124 -> ProjectAsLibBuilder.process_extra_options), то есть ПОСЛЕ
; -Os платформы, и поэтому выигрывает. build_flags/build_unflags на это не
; способны. Подробности и замеры — AGENTS.md, "Hardware constraints".
build_src_flags =
    -Oz

; RGB-вариант индикатора (PC7=red, PC4=green, PC6=blue), pio run -e Proteus32-RGB.
; WL_FORMAT_VERSION общий (4): в этом варианте драйвера старого формата EE.aux
; не существует, а дефолтная прошивка байт-идентична прежней.
[env:Proteus32-RGB]
extends = env:Proteus32
build_flags = 
    ${env:Proteus32.build_flags}
    -DUSE_IND_RGB=1

; Варианты прошивки под ЦАП MCP4725 (USE_DAC_MCP4725=1, I2C 0x60)
[env:Proteus32-MCP4725]
extends = env:Proteus32
build_flags = 
    ${env:Proteus32.build_flags}
    -DUSE_DAC_MCP4725=1

[env:Proteus32-RGB-MCP4725]
extends = env:Proteus32-RGB
build_flags = 
    ${env:Proteus32-RGB.build_flags}
    -DUSE_DAC_MCP4725=1

; Сервисная микропрошивка для однократной записи 0x000 в EEPROM MCP4725
[env:mcp4725-init]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
board = genericCH32V003F4U6
framework = noneos-sdk
monitor_speed = 460800
board_build.use_lto = yes
board_build.ldscript = Link.ld
board_build.f_cpu = 24000000L
board_upload.maximum_size = 16128
build_flags = 
    -I${PROJECT_PACKAGES_DIR}/toolchain-riscv/riscv-wch-elf/include
    -Iinclude
    -Isrc
    -Wl,--defsym=FLASH_SIZE=16128
    -Wl,--defsym=RAM_SIZE=2048
    -Wno-packed-bitfield-compat
    -U__PIO_CPP_SUPPORT__
build_src_filter = -<*> +<../tools/mcp4725_init/mcp4725_init.c>
build_src_flags =
    -Oz
